# dsh-peak-hours bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (schedule service, /api/peak-hours routes, the task gate),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI as the composer run-window switch.
- insert:
    - id: peak-hours
      name: 'dsh-peak-hours'
